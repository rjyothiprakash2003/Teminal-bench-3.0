name = "stateful-parser-recovery"
artifacts = ["/app/src/quill.py"]

[metadata]
author_name = "anonymous"
author_email = "anonymous"
category = "Software"
subcategory = "Systems"
tags = ["parser", "fault-recovery", "nested-scopes", "bindings", "python"]
